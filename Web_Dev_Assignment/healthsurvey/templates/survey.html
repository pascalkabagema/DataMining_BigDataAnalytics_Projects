<!DOCTYPE html>
<html>
<head>
    <title>Health Survey Report</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f8;
        }
        table {
            width: 90%;
            margin: auto;
            border-collapse: collapse;
            background: white;
        }
        th, td {
            padding: 10px;
            border: 1px solid #ccc;
            text-align: center;
        }
        th {
            background-color: #2c7be5;
            color: white;
        }
        h2 {
            text-align: center;
            margin-top: 20px;
        }
    </style>
</head>

<body>

<h2>Health Survey Data, Group9</h2>

<table>
    <tr>
        <th>Name</th>
        <th>Age</th>
        <th>Gender</th>
        <th>Condition</th>
        <th>Exercise</th>
        <th>Remarks</th>
        <th>Date_Recorded</th>
    </tr>

    {% for survey in surveys %}
    <tr>
        <td>{{ survey.full_name }}</td>
        <td>{{ survey.age }}</td>
        <td>{{ survey.gender }}</td>
        <td>{{ survey.health_condition }}</td>
        <td>{{ survey.exercise_frequency }}</td>
        <td>{{ survey.remarks }}</td>
        <td>{{ survey.date_recorded }}</td>
    </tr>
    {% endfor %}
</table>

</body>
</html>
